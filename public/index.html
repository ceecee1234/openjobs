<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>OpenJobs</title>
</head>
<body>
<h1>OpenJobs Daily</h1>
<ul id="job-list"></ul>
<script>
fetch('jobs/jobs.json')
  .then(res => res.json())
  .then(jobs => {
    const ul = document.getElementById('job-list');
    jobs.forEach(job => {
      const li = document.createElement('li');
      li.innerHTML = `<a href="${job.url}" target="_blank">${job.title}</a> @ ${job.company} (${job.location})`;
      ul.appendChild(li);
    });
  });
</script>
</body>
</html>
