<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 远程职位 · OpenJobs</title>
<meta name="description" content="精选来自顶级科技公司的 AI 与远程工作机会，每日更新。">
<meta name="theme-color" content="#0f172a">
<link rel="canonical" href="https://openjobs.genedai.me/">
<link rel="alternate" type="application/rss+xml" title="OpenJobs RSS" href="rss.xml">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --primary: #6366f1;
    --secondary: #0ea5e9;
    --bg: #0f172a;
    --bg-elev: #1e293b;
    --bg-hover: #273449;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
    --radius: 14px;
    --focus: 0 0 0 3px rgba(99, 102, 241, .45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
    background-image: radial-gradient(ellipse at top, rgba(99, 102, 241, .14), transparent 60%);
    background-repeat: no-repeat;
  }
  a { color: inherit; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: none; box-shadow: var(--focus); border-radius: 8px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .container { max-width: 1200px; margin: 0 auto; padding: 0 1.25rem; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(15, 23, 42, .85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { display: flex; align-items: center; gap: .6rem; font-weight: 700; text-decoration: none; }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 10px; background: var(--gradient);
    display: grid; place-items: center; font-size: 1.05rem;
  }
  nav { display: flex; gap: 1.5rem; }
  nav a { color: var(--muted); text-decoration: none; font-size: .9rem; font-weight: 500; }
  nav a:hover { color: var(--text); }

  /* Hero */
  .hero { padding: 3.5rem 0 2rem; text-align: center; }
  .hero h1 {
    font-size: clamp(1.9rem, 4.5vw, 3rem); font-weight: 800; letter-spacing: -.02em;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { color: var(--muted); max-width: 620px; margin: .9rem auto 0; font-size: 1.05rem; }
  .stats { display: flex; justify-content: center; gap: clamp(1.5rem, 5vw, 3.5rem); margin-top: 2rem; flex-wrap: wrap; }
  .stat-number { font-size: 1.8rem; font-weight: 700; color: #a5b4fc; font-variant-numeric: tabular-nums; }
  .stat-label { font-size: .8rem; color: var(--muted); }

  /* Toolbar */
  .toolbar {
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1rem; box-shadow: 0 25px 50px -20px rgba(0, 0, 0, .6);
    display: grid; gap: .75rem;
    grid-template-columns: 2fr repeat(3, minmax(0, 1fr));
  }
  .field {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: .7rem .9rem; font-size: .95rem; transition: border-color .2s;
  }
  .field:focus { border-color: var(--primary); outline: none; box-shadow: var(--focus); }
  .field::placeholder { color: #64748b; }
  select.field { appearance: none; cursor: pointer; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 2rem; }

  .chips { grid-column: 1 / -1; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; padding-top: .75rem; border-top: 1px solid var(--border); }
  .chip {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: .4rem .85rem; border-radius: 999px; cursor: pointer; font-size: .85rem; transition: all .2s;
  }
  .chip:hover { color: var(--text); border-color: var(--primary); }
  .chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
  .chip .count { opacity: .7; margin-left: .3rem; font-variant-numeric: tabular-nums; }
  .reset { margin-left: auto; background: none; border: none; color: var(--secondary); cursor: pointer; font-size: .85rem; padding: .4rem; }
  .reset[hidden] { display: none; }

  /* Results */
  main { padding: 2.5rem 0 1rem; }
  .results-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.25rem; gap: 1rem; flex-wrap: wrap; }
  .results-head h2 { font-size: 1.35rem; font-weight: 700; }
  .results-count { color: var(--muted); font-size: .9rem; }

  .jobs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 1.1rem; }
  .job-card {
    display: flex; flex-direction: column; gap: .9rem;
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.25rem; text-decoration: none; transition: transform .2s, border-color .2s, background .2s, box-shadow .2s;
  }
  .job-card:hover { background: var(--bg-hover); border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 18px 36px -16px rgba(99, 102, 241, .35); }
  .job-top { display: flex; gap: .85rem; align-items: center; min-width: 0; }
  .avatar {
    width: 44px; height: 44px; border-radius: 12px; flex: none; display: grid; place-items: center;
    font-weight: 700; color: #fff; font-size: 1.05rem;
  }
  .job-title { font-weight: 600; font-size: 1.02rem; line-height: 1.35; overflow-wrap: anywhere; }
  .job-company { color: var(--muted); font-size: .88rem; margin-top: .15rem; }
  .job-tags { display: flex; gap: .45rem; flex-wrap: wrap; margin-top: auto; }
  .tag { font-size: .75rem; font-weight: 500; padding: .3rem .6rem; border-radius: 6px; background: rgba(99, 102, 241, .12); color: #a5b4fc; }
  .tag.loc { background: rgba(14, 165, 233, .12); color: #7dd3fc; }
  .job-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: .8rem; font-size: .85rem; color: var(--muted); }
  .job-cta { color: #c4b5fd; font-weight: 600; }

  .state { grid-column: 1 / -1; text-align: center; padding: 3.5rem 1rem; color: var(--muted); }
  .state .icon { font-size: 2.2rem; margin-bottom: .5rem; }
  .state button { margin-top: 1rem; }
  .skeleton { height: 150px; border-radius: var(--radius); background: linear-gradient(90deg, var(--bg-elev) 25%, var(--bg-hover) 50%, var(--bg-elev) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border: 1px solid var(--border); }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .btn {
    background: var(--gradient); border: none; color: #fff; font-weight: 600; cursor: pointer;
    padding: .7rem 1.5rem; border-radius: 10px; transition: opacity .2s;
  }
  .btn:hover { opacity: .9; }
  .more { display: flex; justify-content: center; margin-top: 2rem; }
  .more[hidden] { display: none; }

  /* Companies */
  .companies { padding: 3rem 0 1rem; }
  .companies h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 1.25rem; }
  .companies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: .85rem; }
  .company-card {
    display: flex; align-items: center; gap: .75rem; text-align: left; cursor: pointer;
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; padding: .8rem .9rem; transition: border-color .2s, transform .2s;
  }
  .company-card:hover { border-color: var(--primary); transform: translateY(-2px); }
  .company-card .avatar { width: 36px; height: 36px; font-size: .9rem; border-radius: 10px; }
  .company-name { font-weight: 600; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .company-meta { font-size: .78rem; color: var(--muted); }

  footer { margin-top: 3.5rem; border-top: 1px solid var(--border); padding: 2rem 0; color: var(--muted); font-size: .85rem; }
  .footer-inner { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  .footer-inner a { color: var(--muted); text-decoration: none; margin-left: 1.2rem; }
  .footer-inner a:hover { color: var(--text); }

  @media (max-width: 860px) {
    .toolbar { grid-template-columns: 1fr 1fr; }
    .toolbar .search { grid-column: 1 / -1; }
  }
  @media (max-width: 560px) {
    nav a:not(.gh) { display: none; }
    .toolbar { grid-template-columns: 1fr; }
    .jobs-grid { grid-template-columns: 1fr; }
    .reset { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<header>
  <div class="container header-inner">
    <a href="./" class="logo" aria-label="OpenJobs 首页">
      <span class="logo-mark" aria-hidden="true">🚀</span>
      <span>AI Remote Jobs</span>
    </a>
    <nav aria-label="主导航">
      <a href="#jobs">职位</a>
      <a href="#companies">公司</a>
      <a href="rss.xml">RSS</a>
      <a class="gh" href="https://github.com/ceecee1234/openjobs" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>
  </div>
</header>

<section class="hero container">
  <h1>发现全球最佳 AI 远程工作</h1>
  <p>来自顶级科技公司的精选远程职位，按公司、地点和方向快速筛选，每日自动更新。</p>
  <div class="stats" aria-live="polite">
    <div><div class="stat-number" id="stat-jobs">–</div><div class="stat-label">职位</div></div>
    <div><div class="stat-number" id="stat-companies">–</div><div class="stat-label">公司</div></div>
    <div><div class="stat-number" id="stat-locations">–</div><div class="stat-label">地点</div></div>
  </div>
</section>

<section class="container" aria-label="筛选">
  <form class="toolbar" id="toolbar" role="search" onsubmit="return false">
    <div class="search">
      <label class="sr-only" for="search-input">搜索职位或公司</label>
      <input class="field" type="search" id="search-input" placeholder="搜索职位、公司，例如 “Python” 或 “Stripe”" autocomplete="off">
    </div>
    <div>
      <label class="sr-only" for="company-filter">按公司筛选</label>
      <select class="field" id="company-filter"><option value="">所有公司</option></select>
    </div>
    <div>
      <label class="sr-only" for="location-filter">按地点筛选</label>
      <select class="field" id="location-filter"><option value="">所有地点</option></select>
    </div>
    <div>
      <label class="sr-only" for="sort-select">排序</label>
      <select class="field" id="sort-select">
        <option value="company">按公司 A-Z</option>
        <option value="title">按职位 A-Z</option>
        <option value="location">按地点 A-Z</option>
      </select>
    </div>
    <div class="chips" id="category-chips" role="group" aria-label="职位方向"></div>
  </form>
</section>

<main id="jobs" class="container">
  <div class="results-head">
    <h2>热门职位</h2>
    <span class="results-count" id="results-count" aria-live="polite"></span>
  </div>
  <div class="jobs-grid" id="jobs-grid">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
  <div class="more" id="more-wrap" hidden>
    <button class="btn" id="more-btn" type="button">加载更多</button>
  </div>
</main>

<section class="container companies" id="companies" aria-labelledby="companies-title">
  <h2 id="companies-title">合作公司</h2>
  <div class="companies-grid" id="companies-grid"></div>
</section>

<footer>
  <div class="container footer-inner">
    <span>© <span id="year"></span> OpenJobs · 用 ❤️ 为远程工作者打造 · 职位信息请以公司官网为准</span>
    <span>
      <a href="rss.xml">RSS</a>
      <a href="https://github.com/ceecee1234/openjobs" target="_blank" rel="noopener noreferrer">GitHub</a>
    </span>
  </div>
</footer>

<script>
(() => {
  'use strict';

  const DATA_URL = 'jobs.json';
  const STATS_URL = 'stats.json';
  const PAGE_SIZE = 24;
  const CATEGORIES = ['全部', 'AI', 'Developer', 'DevOps', 'SEO', 'Other'];
  const CATEGORY_LABELS = { 'AI': 'AI 相关', 'Developer': '开发者', 'DevOps': 'DevOps', 'SEO': 'SEO / 营销', 'Other': '其他' };
  // Keep in sync with CATEGORY_RULES in scripts/build_site.py.
  const CATEGORY_RULES = [
    ['AI', /\b(ai|ml|machine learning|data scientist|llm)\b/i],
    ['DevOps', /\b(devops|sre|infrastructure|platform)\b/i],
    ['SEO', /\b(seo|marketing|content)\b/i],
    ['Developer', /\b(frontend|backend|fullstack|full stack|python|software|engineer|developer)\b/i],
  ];
  const PALETTE = ['#6366f1', '#8b5cf6', '#ec4899', '#0ea5e9', '#f59e0b', '#22c55e', '#f97316', '#14b8a6'];

  const $ = (id) => document.getElementById(id);
  const els = {
    search: $('search-input'), company: $('company-filter'), location: $('location-filter'),
    sort: $('sort-select'), chips: $('category-chips'), grid: $('jobs-grid'),
    count: $('results-count'), moreWrap: $('more-wrap'), moreBtn: $('more-btn'),
    companies: $('companies-grid'),
  };

  const state = { jobs: [], category: '全部', page: 1 };

  // ---------- helpers ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const categoryOf = (title) => {
    for (const [name, re] of CATEGORY_RULES) if (re.test(title)) return name;
    return 'Other';
  };
  const colorOf = (name) => {
    let h = 0;
    for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return PALETTE[h % PALETTE.length];
  };
  const initial = (name) => esc(Array.from(name.trim())[0] || '?').toUpperCase();
  const safeHref = (url) => {
    try {
      const u = new URL(url, location.href);
      return ['http:', 'https:'].includes(u.protocol) || u.pathname.endsWith('.html') ? esc(url) : '#';
    } catch { return '#'; }
  };
  const isExternal = (url) => /^https?:\/\//i.test(url);
  const uniqueSorted = (arr) => [...new Set(arr)].sort((a, b) => a.localeCompare(b, 'zh-CN'));

  // ---------- URL state ----------
  function readUrl() {
    const p = new URLSearchParams(location.search);
    els.search.value = p.get('q') || '';
    state.category = CATEGORIES.includes(p.get('cat')) ? p.get('cat') : '全部';
    const sort = p.get('sort');
    if (['company', 'title', 'location'].includes(sort)) els.sort.value = sort;
    // company/location selects are populated later, so keep the wanted value.
    state.wantCompany = p.get('company') || '';
    state.wantLocation = p.get('location') || '';
  }
  function writeUrl() {
    const p = new URLSearchParams();
    if (els.search.value.trim()) p.set('q', els.search.value.trim());
    if (els.company.value) p.set('company', els.company.value);
    if (els.location.value) p.set('location', els.location.value);
    if (state.category !== '全部') p.set('cat', state.category);
    if (els.sort.value !== 'company') p.set('sort', els.sort.value);
    const qs = p.toString();
    history.replaceState(null, '', qs ? `?${qs}` : location.pathname);
  }

  // ---------- filtering ----------
  function filtered() {
    const q = els.search.value.trim().toLowerCase();
    const company = els.company.value;
    const location = els.location.value;
    const cat = state.category;
    const key = { company: 'company', title: 'title', location: 'location' }[els.sort.value] || 'company';

    return state.jobs
      .filter((j) => (!q || j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q) || j.location.toLowerCase().includes(q)))
      .filter((j) => !company || j.company === company)
      .filter((j) => !location || j.location === location)
      .filter((j) => cat === '全部' || j.category === cat)
      .sort((a, b) => a[key].localeCompare(b[key], 'zh-CN') || a.title.localeCompare(b.title, 'zh-CN'));
  }

  // ---------- rendering ----------
  function jobCard(j) {
    const href = safeHref(j.url);
    const target = isExternal(j.url) ? ' target="_blank" rel="noopener noreferrer"' : '';
    return `
      <a class="job-card" href="${href}"${target}>
        <div class="job-top">
          <div class="avatar" style="background:${colorOf(j.company)}" aria-hidden="true">${initial(j.company)}</div>
          <div style="min-width:0">
            <div class="job-title">${esc(j.title)}</div>
            <div class="job-company">${esc(j.company)}</div>
          </div>
        </div>
        <div class="job-tags">
          <span class="tag">${esc(CATEGORY_LABELS[j.category] || j.category)}</span>
          <span class="tag loc">📍 ${esc(j.location)}</span>
        </div>
        <div class="job-foot">
          <span>查看详情</span>
          <span class="job-cta">申请 →</span>
        </div>
      </a>`;
  }

  function renderChips() {
    const counts = Object.fromEntries(CATEGORIES.map((c) => [c, 0]));
    state.jobs.forEach((j) => { counts['全部']++; counts[j.category] = (counts[j.category] || 0) + 1; });
    els.chips.innerHTML = CATEGORIES
      .filter((c) => c === '全部' || counts[c] > 0)
      .map((c) => `<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${c === state.category}">${esc(CATEGORY_LABELS[c] || c)}<span class="count">${counts[c]}</span></button>`)
      .join('') + `<button type="button" class="reset" id="reset-btn">清除筛选</button>`;
  }

  function renderSelects() {
    const fill = (sel, label, values, keep) => {
      sel.innerHTML = `<option value="">${label}</option>` +
        values.map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
      if (keep && values.includes(keep)) sel.value = keep;
    };
    fill(els.company, '所有公司', uniqueSorted(state.jobs.map((j) => j.company)), state.wantCompany);
    fill(els.location, '所有地点', uniqueSorted(state.jobs.map((j) => j.location)), state.wantLocation);
  }

  function renderCompanies() {
    const counts = {};
    state.jobs.forEach((j) => { counts[j.company] = (counts[j.company] || 0) + 1; });
    els.companies.innerHTML = Object.entries(counts)
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh-CN'))
      .map(([name, n]) => `
        <button type="button" class="company-card" data-company="${esc(name)}">
          <span class="avatar" style="background:${colorOf(name)}" aria-hidden="true">${initial(name)}</span>
          <span style="min-width:0">
            <span class="company-name" style="display:block">${esc(name)}</span>
            <span class="company-meta">${n} 个职位</span>
          </span>
        </button>`).join('');
  }

  function render({ reset = true } = {}) {
    if (reset) state.page = 1;
    const list = filtered();
    const shown = list.slice(0, state.page * PAGE_SIZE);

    els.count.textContent = list.length ? `共 ${list.length} 个职位` : '';
    if (!list.length) {
      els.grid.innerHTML = `
        <div class="state">
          <div class="icon">🔍</div>
          <p>没有找到匹配的职位</p>
          <button class="btn" type="button" data-action="reset">清除筛选</button>
        </div>`;
    } else {
      els.grid.innerHTML = shown.map(jobCard).join('');
    }
    els.moreWrap.hidden = shown.length >= list.length;
    renderChips();
    writeUrl();
  }

  function showError(msg) {
    els.grid.innerHTML = `<div class="state"><div class="icon">⚠️</div><p>${esc(msg)}</p></div>`;
    els.count.textContent = '';
  }

  function resetFilters() {
    els.search.value = '';
    els.company.value = '';
    els.location.value = '';
    state.category = '全部';
    render();
  }

  // ---------- events ----------
  let searchTimer;
  els.search.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => render(), 120); });
  els.company.addEventListener('change', () => render());
  els.location.addEventListener('change', () => render());
  els.sort.addEventListener('change', () => render());
  els.moreBtn.addEventListener('click', () => { state.page++; render({ reset: false }); });
  els.chips.addEventListener('click', (e) => {
    if (e.target.closest('#reset-btn')) return resetFilters();
    const chip = e.target.closest('.chip');
    if (!chip) return;
    state.category = chip.dataset.cat;
    render();
  });
  els.grid.addEventListener('click', (e) => { if (e.target.closest('[data-action="reset"]')) resetFilters(); });
  els.companies.addEventListener('click', (e) => {
    const card = e.target.closest('[data-company]');
    if (!card) return;
    els.company.value = card.dataset.company;
    render();
    $('jobs').scrollIntoView({ behavior: 'smooth' });
  });

  // ---------- boot ----------
  async function loadJson(url) {
    const res = await fetch(url, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`${url} → HTTP ${res.status}`);
    return res.json();
  }

  async function init() {
    $('year').textContent = new Date().getFullYear();
    readUrl();

    // Stats come from the generated stats.json; fall back to counting jobs.
    loadJson(STATS_URL).then((s) => {
      $('stat-jobs').textContent = s.total_jobs;
      $('stat-companies').textContent = s.total_companies;
      $('stat-locations').textContent = s.total_locations;
    }).catch(() => {});

    try {
      const raw = await loadJson(DATA_URL);
      if (!Array.isArray(raw)) throw new Error('职位数据格式错误');
      state.jobs = raw
        .filter((j) => j && j.title && j.company && j.url)
        .map((j) => ({
          title: String(j.title), company: String(j.company),
          location: String(j.location || 'Remote'), url: String(j.url),
          category: categoryOf(String(j.title)),
        }));
    } catch (err) {
      console.error('加载失败:', err);
      showError('加载职位数据失败，请稍后刷新页面。');
      return;
    }

    if (!$('stat-jobs').textContent || $('stat-jobs').textContent === '–') {
      $('stat-jobs').textContent = state.jobs.length;
      $('stat-companies').textContent = new Set(state.jobs.map((j) => j.company)).size;
      $('stat-locations').textContent = new Set(state.jobs.map((j) => j.location)).size;
    }

    renderSelects();
    renderCompanies();
    render();
  }

  init();
})();
</script>
</body>
</html>
