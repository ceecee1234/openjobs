import os
import requests

def send_telegram_message(token, chat_id, text):
    """向 Telegram 机器人发送消息的通用函数"""
    url = f"https://api.telegram.org/bot{token}/sendMessage"
    payload = {
        "chat_id": chat_id,
        "text": text,
        "parse_mode": "Markdown"
    }
    try:
        response = requests.post(url, json=payload)
        if response.status_code == 200:
            print("✅ Telegram 消息发送成功！")
        else:
            print(f"❌ Telegram 发送失败，状态码: {response.status_code}, 回应: {response.text}")
    except Exception as e:
        print(f"💥 发送过程中出现异常: {e}")

def main():
    # 从 GitHub Actions 的 env 中读取密钥
    token = os.getenv("TELEGRAM_BOT_TOKEN")
    chat_id = os.getenv("TELEGRAM_CHAT_ID")
    
    if not token or not chat_id:
        print("⚠️ 未检测到 TELEGRAM_BOT_TOKEN 或 TELEGRAM_CHAT_ID，请检查 GitHub Secrets 配置！")
        return

    print("🚀 开始执行 OpenJobs 定时数据更新任务...")
    
    # ----------------------------------------------------
    # 💡 这里写你原本的抓取/数据处理业务逻辑
    # 示例：假设我们获取到了一些新数据
    job_count = 5 
    message_text = f"📢 *OpenJobs 自动更新报告*\n\n定时任务已成功运行！运行周期：每 12 小时。\n当前成功更新了 {job_count} 个最新职位数据。"
    # ----------------------------------------------------
    
    # 发送通知到 Telegram
    send_telegram_message(token, chat_id, message_text)

if __name__ == "__main__":
    main()