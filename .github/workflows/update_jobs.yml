name: Update Jobs
on:
  schedule:
    - cron: "0 */12 * * *"  # 自动运行：每12小时（一天两次）自动触发一次
  workflow_dispatch:        # 手动触发：允许你在 GitHub 页面上点按钮随时运行

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # 已升级到更稳定的 v4 版本

      - name: Set up Python
        uses: actions/setup-python@v5  # 已升级到更稳定的 v5 版本
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Update Script
        run: python scripts/update_jobs.py  # 云端会自动寻找项目里的这个 Python 脚本运行
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}